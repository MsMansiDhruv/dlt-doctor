[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlt-doctor"
version = "0.5.0"
description = "Production optimization engine and quality accelerator for Databricks Delta Live Tables, Auto Loader, and PySpark pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Mansi Dhruv", email = "mansi.p.dhruv@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "sqlglot>=20.0.0",
    "rich>=13.0.0",
    "tomli>=1.1.0;python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/mansidhr/dlt-doctor"
Documentation = "https://mansidhr.github.io/dlt-doctor/"
Repository = "https://github.com/mansidhr/dlt-doctor.git"
Issues = "https://github.com/mansidhr/dlt-doctor/issues"
Changelog = "https://github.com/mansidhr/dlt-doctor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
]
spark = [
    "pyspark>=3.5.0",
    "delta-spark>=3.0.0",
]

[project.scripts]
dlt-doctor = "dlt_doctor.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dlt_doctor*"]

[tool.setuptools.package-data]
dlt_doctor = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF012", "B008", "SIM108"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests (requiring pyspark or local environment)"
]
