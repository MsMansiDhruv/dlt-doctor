name: "dlt-doctor"
description: "Production optimization and quality engine for Databricks Lakeflow, DLT, and PySpark"
author: "Mansi Dhruv"

inputs:
  path:
    description: "Path to Python (.py), SQL (.sql), notebook (.ipynb), or directory to analyze"
    required: true
    default: "src"
  format:
    description: "Output format: text, markdown, json, sarif, or html"
    required: false
    default: "text"
  fail-on:
    description: "Failure severity threshold: CRITICAL, HIGH, MEDIUM, LOW, or NONE"
    required: false
    default: "CRITICAL"
  check-heal:
    description: "Check pipeline files for zero-loss quarantine compliance using heal --check"
    required: false
    default: "false"
  config:
    description: "Path to custom configuration file (e.g. pyproject.toml)"
    required: false
    default: ""
  sarif-output:
    description: "Optional file path to write SARIF diagnostic output"
    required: false
    default: ""
  python-version:
    description: "Python version for action execution"
    required: false
    default: "3.10"
  working-directory:
    description: "Working directory"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dlt-doctor
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ github.action_path }}"

    - name: Run dlt-doctor analyze
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        python -m dlt_doctor.action

    - name: Run dlt-doctor heal check
      if: always() && inputs.check-heal == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HEAL_PATH: ${{ inputs.path }}
        HEAL_CONFIG: ${{ inputs.config }}
      run: |
        HEAL_CMD=(dlt-doctor heal "$HEAL_PATH" --check)
        if [ -n "$HEAL_CONFIG" ]; then
          HEAL_CMD+=(--config "$HEAL_CONFIG")
        fi
        "${HEAL_CMD[@]}"

branding:
  icon: "activity"
  color: "green"
