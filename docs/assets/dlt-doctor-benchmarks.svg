<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0E172B"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E34" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B1322" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#2EE6A7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FF9B4A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#bgGrad)" rx="16"/>
  <rect x="1" y="1" width="1198" height="558" fill="none" stroke="#1E293B" stroke-width="2" rx="15"/>

  <!-- Title & Header -->
  <text x="50" y="55" fill="#2EE6A7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MEASURED PRODUCTION PERFORMANCE</text>
  <text x="50" y="90" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Databricks Runtime 15.4 LTS • 10M Transaction Benchmark</text>
  <text x="50" y="115" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Default PySpark Anti-Patterns vs dlt-doctor Refactored Pipelines</text>

  <!-- Metric Card 1: Late Data Backfill (Scan Reduction) -->
  <g transform="translate(50, 145)">
    <rect width="525" height="110" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="34" fill="#94A3B8" font-family="monospace" font-size="12">LATE DATA ROLLING RESTORATION</text>
    <text x="24" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">Partition Scan Reduction</text>
    <text x="24" y="92" fill="#64748B" font-family="monospace" font-size="12">Full 365d reload (2.4 TB) → Bounded 7d MERGE (48 GB)</text>
    
    <text x="495" y="65" text-anchor="end" fill="#2EE6A7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900" filter="url(#glow)">98.1%</text>
    <text x="495" y="85" text-anchor="end" fill="#10B981" font-family="monospace" font-size="11">LESS DBU I/O</text>
  </g>

  <!-- Metric Card 2: Row Transformation (UDF Acceleration) -->
  <g transform="translate(625, 145)">
    <rect width="525" height="110" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="34" fill="#94A3B8" font-family="monospace" font-size="12">SERIALIZATION OVERHEAD</text>
    <text x="24" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">Python UDF Acceleration</text>
    <text x="24" y="92" fill="#64748B" font-family="monospace" font-size="12">Row-by-row socket IPC → Whole-Stage CodeGen / Arrow</text>
    
    <text x="495" y="65" text-anchor="end" fill="#FF9B4A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900">15.4x</text>
    <text x="495" y="85" text-anchor="end" fill="#F59E0B" font-family="monospace" font-size="11">FASTER COMPUTE</text>
  </g>

  <!-- Metric Card 3: Small-File Compaction Query Scan -->
  <g transform="translate(50, 275)">
    <rect width="525" height="110" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="34" fill="#94A3B8" font-family="monospace" font-size="12">DELTA STORAGE OPTIMIZATION</text>
    <text x="24" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">Query Table Scan Speed</text>
    <text x="24" y="92" fill="#64748B" font-family="monospace" font-size="12">4,200 fragmented 8MB files (34.2s) → 128MB target (1.8s)</text>
    
    <text x="495" y="65" text-anchor="end" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900">18.8x</text>
    <text x="495" y="85" text-anchor="end" fill="#0284C7" font-family="monospace" font-size="11">SCAN SPEEDUP</text>
  </g>

  <!-- Metric Card 4: Join Skew & Straggler Remediation -->
  <g transform="translate(625, 275)">
    <rect width="525" height="110" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="34" fill="#94A3B8" font-family="monospace" font-size="12">PARTITION SKEW MITIGATION</text>
    <text x="24" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">Join Straggler Elimination</text>
    <text x="24" y="92" fill="#64748B" font-family="monospace" font-size="12">45m single-task executor hang → 3.2m AQE key salting</text>
    
    <text x="495" y="65" text-anchor="end" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900">14.1x</text>
    <text x="495" y="85" text-anchor="end" fill="#6366F1" font-family="monospace" font-size="11">WALL-CLOCK WIN</text>
  </g>

  <!-- Bottom Visual Bar: Zero Silent Loss & Zero Merge Crashes -->
  <g transform="translate(50, 405)">
    <rect width="1100" height="110" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    
    <g transform="translate(40, 25)">
      <circle cx="20" cy="25" r="16" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2"/>
      <path d="M14 25 L18 29 L26 21" stroke="#2EE6A7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="50" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Zero Silent Regulatory Drops</text>
      <text x="50" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Dual-routing quarantine stream routes invalid records with rule tags instead of expect_or_drop.</text>
    </g>

    <line x1="570" y1="20" x2="570" y2="90" stroke="#1E293B" stroke-width="1.5"/>

    <g transform="translate(610, 25)">
      <circle cx="20" cy="25" r="16" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2"/>
      <path d="M14 25 L18 29 L26 21" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="50" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Zero Streaming CDC Merge Failures</text>
      <text x="50" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">In-batch window deduplication eliminates DeltaAnalysisException multiple-match crashes.</text>
    </g>
  </g>
</svg>
